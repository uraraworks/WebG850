    notes: 独語版の実行例出力は「1. 51」でOCR崩れを疑っていたが、英語版で同じ例が「1.51」と明瞭に出力されており、かつ1度30分36秒を10進度に換算すると1+30/60+36/3600=1.51度という計算結果とも一致することから、OCR崩れではなく正しい数値だったと確定できた。度分秒の区切り記号自体は両版とも度記号・分記号・秒記号(ダブルクォート)による標準的なDMS表記。
