  - name: NOT
    aliases: []
    kind: operator
    category: math
    format: NOT <数値式>
    summary: 論理否定を表す単項演算子。数値式を-32768〜+32767の16bit2の補数表現に変換し、ビットごとに反転してから10進に戻す全ビット反転演算(NOT X = -(X+1))。AND/OR/XORと同じ節でビット単位の真理値表として明記される。
    params:
      - name: 数値式
        type: numeric
        optional: false
        range: -32768 <= x <= 32767
        notes: null
    returns: numeric
    errors: []
    phase: 1
    status: documented
    ocr_suspect: false
    verified_by: manual_3rd_party
    verifiable_by_measurement: true
    source: manual_de p.42 (5.11 論理式), p.209 (IF..THEN..ELSE) / manual_en p.40-41 (5.4.4 Logical
      Expressions)
    notes: 英語版5.4.4節に、独語版には無かったAND/OR/XOR/NOTのビット単位真理値表が実際の0/1の値付きで収録されており、NOTの列は「X=1→NOT
      X=0、X=0→NOT X=1」という単純な1ビット反転であることが確定した。AND/OR/XORと同じ16bit2の補数変換規則がNOTにも適用されるため、全体としてはNOT
      X = -(X+1)という一般的なBASICのビット単位NOTの定義と一致する(単純な論理否定0→-1ではない)。
