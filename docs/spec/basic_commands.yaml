    format: RANDOMIZE
    summary: RNDが生成する乱数系列の種を変える。既定の種は電源投入のたびに同一で、RANDOMIZE未使用時はRNDの系列が毎回再現される。RANDOMIZEを実行すると種が(何らかの方法で)新しい値に変わる。
    params: []
    returns: none
    errors: []
    phase: 1
    status: partial
    ocr_suspect: false
    verified_by: manual_3rd_party
    verifiable_by_measurement: true
    source: manual_de p.236 / manual_en p.224
    notes: '【両版で食い違う可能性、要実測】英語版は「既定の種は電源投入のたびに同一(そのためRND使用時もプログラムの挙動が再現可能でデバッグに便利)であり、RANDOMIZEを実行すると種を新しいランダムな値にリセットする」と明快に説明する(独語版にはこの説明が無い)。ところが独語版の実行例では、プログラム冒頭にRANDOMIZEを置いたうえで電源をOFF→ONしてRUNし直しても、5個の乱数列(2,1,10,8,10)が寸分違わず再現されており、英語版の「新しいランダムな値になる」という説明と食い違うように見える。英語版は数値例そのものを収録していないため、この矛盾を裏付ける独自データが無い。デモの手順自体が毎回同じキー操作タイミングだった可能性(=種の実体が経過時間やキー入力タイミングに依存する擬似乱数で、同一手順なら同一結果になる)も否定できず、種の決定要因(内部カウンタ・実時間・ユーザー操作タイミング等)は両版から確定できない。関連:
      RND'
