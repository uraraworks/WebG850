      51 MOD 5=1、51 MOD -5.7=3(-5.7は-6に丸められ51÷-6=-8…3)、87.57 MOD 5.4=3(87.57→88、5.4→5に丸められ88÷5=17…3)。両オペランドを四捨五入で最も近い整数に丸めたうえで商を0方向へ切り捨てる整数除算を行い、余りを返す典型的なBASICのMOD挙動と一致することを確認できた。ビット演算ではなく算術演算子であることも変わらず(5.11節のAND/OR/XOR/NOTとは別表)。DMS形式(30º36´のような度分表記)のオペランドも例に含まれるが、その場合の丸め規則の詳細(角度→整数変換の基準)までは未確認。'
