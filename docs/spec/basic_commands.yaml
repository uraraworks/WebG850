  - name: CIRCLE
    aliases: []
    kind: statement
    category: graphics
    format: CIRCLE (<x>,<y>),<半径>[,[開始角],[終了角],[縦横比][,S|R|X],[パターン]]
    summary: 円・円弧・扇形・楕円を描画する。
    params:
      - name: x
        type: numeric
        optional: false
        range: 表示域0-143、指定可能範囲-32768〜32767
        notes: null
      - name: y
        type: numeric
        optional: false
        range: 表示域0-47、指定可能範囲-32768〜32767
        notes: null
      - name: 半径
        type: numeric
        optional: false
        range: 1-32767
        notes: null
      - name: 開始角
        type: numeric
        optional: true
        range: '独: 0-360 / 英: -360〜360(食い違い、要実測)'
        notes: 省略時0(全円)。
      - name: 終了角
        type: numeric
        optional: true
        range: '独: 0-360 / 英: -360〜360(食い違い、要実測)'
        notes: 省略時360(全円)。
      - name: 縦横比
        type: numeric
        optional: true
        range: null
        notes: ry/rx。省略時1(正円)。
      - name: S|R|X
        type: any
        optional: true
        range: S(セット,既定)|R(消去)|X(反転)
        notes: null
      - name: パターン
        type: numeric
        optional: true
        range: 0-6
        notes: 0=塗りなし(既定),1=横線,2=縦線,3=右上がり斜線,4=右下がり斜線,5=3+4,6=全塗り。
    returns: none
    errors: []
    phase: 1
    status: partial
    ocr_suspect: true
    verified_by: manual_3rd_party
    verifiable_by_measurement: true
    source: manual_de p.190 / manual_en p.183
    notes: '【両版で食い違い、要実測】開始角/終了角の範囲を独語版は「0-360、標準は0/360(全円)」と明記するが、英語版は「-360〜360」と明記した上で「負値は原点から円弧への半径線を描く(扇形になる)、正値は弧のみ」と符号の意味まで説明する。両版共通の実行例
      CIRCLE(71,23),20,-45,-135 は独語自身の「0-360」という記述と矛盾しており、独語側の範囲記述が単純な誤記である可能性が高いが、どちらが実機の実際の受理範囲かは実測しないと断定できないため範囲は確定させない。書式行の角括弧の対応崩れ(閉じ括弧が1つ多い)は英語版でも同じ位置で再現しており、共通のOCR/組版起因の欠陥で未解決。読み取れた通りを収録。'
