  - name: BEEP
    aliases: []
    kind: statement
    category: hardware
    format: BEEP <回数>[,[<音程>][,<持続時間>]]
    summary: 指定回数・音程・持続時間で音を鳴らす。
    params:
      - name: 回数
        type: numeric
        optional: false
        range: 0-65535
        notes: null
      - name: 音程
        type: numeric
        optional: true
        range: 0-255
        notes: 0で約7kHz、255で約230Hz(値が大きいほど低音)。省略時4kHz相当。
      - name: 持続時間
        type: numeric
        optional: true
        range: 0-65279
        notes: 省略時160。周波数が低いほど実際の持続は長くなる。
    returns: none
