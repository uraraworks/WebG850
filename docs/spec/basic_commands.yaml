    source: manual_de p.182
    notes: null
  - name: ACS
    aliases: []
    kind: function
    category: math
    format: ACS(<数値式>)
    summary: 逆余弦(arccos)を返す。単位は現在の角度モード(DEGREE/GRAD/RADIAN)に従う。
    params:
      - name: 数値式
        type: numeric
        optional: false
        range: -1 <= x <= 1
        notes: null
