    verifiable_by_measurement: true
    source: manual_de p.186
    notes: 原文に「ACHTUNG BEIM G850 NICHT ANGESCHLOSSEN(G850では未接続=鳴らない)」との注記あり。G850V(S)での扱いは未確認。
