  - name: REC
    aliases: []
    kind: function
    category: math
    format: REC(<距離>,<角度>)
    summary: 極座標(距離r,角度θ)を直交座標に変換する。関数値としてx成分を返す。角度単位は現在の角度モードに従う。予約変数Y・Zへの格納先については本文の説明と実行例が食い違っており未確定(下記notes参照)。
    params:
      - name: 距離
        type: numeric
        optional: false
        range: null
        notes: null
      - name: 角度
        type: numeric
        optional: false
        range: null
        notes: null
    returns: numeric
    errors: []
    phase: 1
    status: partial
    ocr_suspect: false
    verified_by: manual_3rd_party
    verifiable_by_measurement: true
    source: manual_de p.237 / manual_en p.173
    notes: '【両版で食い違い、要実測】本文(独語・英語とも同内容)は「変換されたx成分・y成分の値はそれぞれ"x軸からの距離"・"y軸からの距離"として予約変数Y・Zに割り当てられる」と説明しており、これを字義通り読めば
      Y=x軸からの距離(=y座標)、Z=y軸からの距離(=x座標)となるはずである。ところが英語版の実行例 REC(12,30)→10.39230485 に編集者注記「(x
      ≈ 10.4)」が付き、続くPRINT Zの結果6に注記「(y = 6)」が付いている(12*cos30°≈10.39=x、12*sin30°=6=y と機械的には整合する)。この関数値・Zへの注記をそのまま受け取ると「関数値(およびおそらくY)=x座標、Z=y座標」であり、本文の文言(Y=x軸からの距離=y座標のはず)と正反対になる。独語版には数値例の出力自体が無くこの矛盾を裏付ける材料が無いため、本文の文言と英語版注記付き実行例のどちらが正しいか、あるいは注記自体が編者の誤読かを判定できない。POLとの対称性(POLはY=r,Z=θで本文と実行例が一致)から見てもRECだけ食い違うのは不自然であり、実機でのY/Zの値を実測して確定する必要がある。関連:
      POL'
