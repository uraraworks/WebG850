    ocr_suspect: false
    verified_by: manual_3rd_party
    verifiable_by_measurement: true
    source: manual_de p.182 / manual_en p.163
    notes: '主値域: DEGモード 0〜180°, RADモード 0〜π, GRADモード 0〜200gon。独: OCR崩れ「-1 s X
      s 1」、英: 明瞭に「-1 ≤ expression ≤ 1」。両版一致で範囲確定、ocr_suspectを解除。'
  - name: AHC
    aliases: []
    kind: function
    category: math
    format: AHC(<数値式>)
    summary: 逆双曲線余弦(arcosh, cosh^-1x)を返す。
    params:
      - name: 数値式
        type: numeric
        optional: false
        range: null
        notes: null
    returns: numeric
    errors: []
    phase: 1
    status: documented
    ocr_suspect: false
    verified_by: manual_3rd_party
    verifiable_by_measurement: true
    source: manual_de p.183
    notes: 実行例 AHC 10 → 2.993222846 は arcosh(10)=ln(10+√99)≈2.9932228 と一致し、逆双曲線余弦であると確認できる。
  - name: AHS
    aliases: []
    kind: function
    category: math
    format: AHS(<数値式>)
    summary: 逆双曲線正弦(arsinh, sinh^-1x)を返す。
    params:
      - name: 数値式
        type: numeric
        optional: false
        range: null
        notes: null
    returns: numeric
    errors: []
    phase: 1
    status: documented
    ocr_suspect: false
    verified_by: manual_3rd_party
    verifiable_by_measurement: true
    source: manual_de p.183
    notes: 実行例 AHS 27.3 → 4.000369154 は arsinh(27.3)=ln(27.3+√(27.3^2+1))≈4.0003692 と一致し、逆双曲線正弦であると確認できる。
  - name: AHT
    aliases: []
    kind: function
    category: math
    format: AHT(<数値式>)
    summary: 逆双曲線正接(artanh, tanh^-1x)を返す。
    params:
      - name: 数値式
        type: numeric
        optional: false
        range: null
        notes: null
    returns: numeric
    errors: []
    phase: 1
    status: documented
    ocr_suspect: false
    verified_by: manual_3rd_party
    verifiable_by_measurement: true
    source: manual_de p.183
    notes: 実行例 AHT 0.7 → 0.867300527 は artanh(0.7)=0.5*ln(1.7/0.3)≈0.8673005 と一致し、逆双曲線正接であると確認できる。なお表示桁数について、docs/spec/number_display.md の導出のとおり実機は有効数字10桁で表示するため正しくは 0.8673005277 であり、マニュアルの 0.867300527 は末尾の 7 が1つ脱字したもの（同じ数字が2つ続く箇所は組版・OCRで落ちやすい）。詳細は docs/spec/number_display.md を参照。
  - name: AND
    aliases: []
    kind: operator
    category: math
    format: <数値式1> AND <数値式2>
    summary: 2つの数値をそれぞれ-32768〜32767の16bit2の補数表現に変換し、対応するビットごとの論理積(AND)を取る。比較式(真=-1/偽=0)同士に使うとIF文の論理AND条件としても機能する。
    params:
      - name: 数値式1
        type: numeric
        optional: false
        range: -32768 <= x <= 32767
        notes: null
      - name: 数値式2
        type: numeric
        optional: false
        range: -32768 <= x <= 32767
        notes: null
    returns: numeric
    errors: []
    phase: 1
    status: documented
    ocr_suspect: false
    verified_by: manual_3rd_party
    verifiable_by_measurement: true
    source: manual_de p.42 (5.11 論理式)
    notes: 'ビット演算であることは本文に明記: 「2つの数値は16桁の2進数(2の補数形式)に変換され、対応するビットのペアごとに論理演算が評価される」。結果の真理値表は原書では図版(未OCR)で本文からは読めない。真=-1(全ビット1)・偽=0という表現規約(5章冒頭, p.42直前)と組み合わさることで、比較式に対するIF文の論理ANDとしても違和感なく働く。'
